<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talk Rehearsal</title>
  <meta name="description" content="Memorise and rehearse your presentation: listen, hide, say it aloud, see what you missed.">
  <meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17162b" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<body>
  <header class="topbar">
    <div class="top-left">

        <span>Back</span>
      </button>
      <button class="brand" data-act="home" aria-label="Home">
        <span class="logo" aria-hidden="true"></span> <span class="brand-name">Talk Rehearsal</span>
      </button>
    </div>
    <div id="topRight" class="top-right"></div>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="import.js"></script>
  <script src="features.js"></script>

  <script src="app.js"></script>
